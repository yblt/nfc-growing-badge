<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>成长吧唧 · M1</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #16161a; color: #e8e8ea; }
      #app { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
      h1 { font-size: 16px; margin: 4px 0 12px; color: #9a9aa5; }
      #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
      .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; }
      .user { align-self: flex-end; background: #2d5a4f; }
      .her { align-self: flex-start; background: #26262e; border: 1px solid #33333d; }
      #bar { display: flex; gap: 8px; padding-top: 12px; }
      #input { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a3a45; background: #1e1e24; color: inherit; }
      button { padding: 10px 18px; border-radius: 10px; border: 0; background: #46c48f; color: #0f1512; font-weight: 600; cursor: pointer; }
      button[disabled] { opacity: .5; cursor: wait; }
      #meta { font-size: 12px; color: #6b6b76; padding-top: 6px; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>单吧唧单角色 · 检索层最小闭环（M1）</h1>
      <div id="log"></div>
      <div id="bar">
        <input id="input" placeholder="说点什么…" />
        <button id="send">发送</button>
      </div>
      <div id="meta">character: xiaoxia ｜ account: dev</div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
